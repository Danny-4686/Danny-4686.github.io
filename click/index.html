  <noscript><div style="position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#02070b;color:#70f1ff;font:16px monospace;text-align:center">JavaScript is required for this sequence.</div></noscript>

  <script type="module">
    /*
      Mobile stability strategy
      ------------------------------------------------------------
      The previous version still created a temporary WebGL context before Globe.gl.
      On iOS/WebKit, releasing that context is asynchronous and can still consume one
      of Safari's limited GPU contexts while the real renderer is starting. This file
      no longer performs a sacrificial WebGL preflight at all.

      Mobile/iOS also uses Globe.gl's built-in arc animation instead of the optional
      custom Three.js particle shader. Desktop keeps the shader, loaded lazily only
      when needed. That means phones create one WebGL renderer and one Three stack.

      Add ?debug=1 to show local-only renderer diagnostics. Nothing is transmitted.
      Add ?lite=1 to force the low-cost profile.
    */
    import Globe from 'https://cdn.jsdelivr.net/npm/globe.gl@2.46.1/+esm';
    import { feature as topoFeature } from 'https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/+esm';

    const CONFIG={
      fallback:{lat:34.0522,lng:-118.2437,city:'Los Angeles',region:'CA',country:'US',timezone:'America/Los_Angeles',quality:'FALLBACK'},
      target:{lat:30.2672,lng:-97.7431,city:'Texas',region:'USA'},
      geo:{timeoutMs:1800,agreeKm:90,regionAgreeKm:220},
      message:'Location found. I know where you are.',
      colors:{cyan:'#70f1ff',cyanHot:'#d4fbff',amber:'#ffbd63'},
      timing:{bootMs:1900,revealHoldMs:250,zoomOutMs:1800,signalMs:2500,landingBeatMs:360,texasZoomMs:1250,typeBaseMs:38,typePunctuationMs:105,glitchMs:250,finalSettleMs:850},
      camera:{cityAltitude:.34,orbitAltitude:2.28,texasAltitude:.5,finalAltitude:.42},

    const els={

    const params=new URLSearchParams(location.search);
    const debugMode=params.get('debug')==='1';
    const queryLite=params.get('lite')==='1';
    const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const ua=navigator.userAgent||'';

    const mobileMode=!reducedMotion&&(isiOS||(mobileViewport&&(coarsePointer||touchDevice)));

    const renderProfile=reducedMotion?'REDUCED':queryLite?'LITE':mobileMode?'MOBILE':constrainedHardware?'LITE':'FULL';
    els.renderMode.textContent=`RENDER PROFILE // ${renderProfile}`;
    if(debugMode)document.body.classList.add('debug-mode');

    const debugLines=[];
    function debug(message){
      if(!debugMode)return;
      const stamp=((performance.now()/1000).toFixed(2)+'s').padStart(8,' ');
      debugLines.push(`${stamp}  ${message}`);if(debugLines.length>12)debugLines.shift();els.debugPanel.textContent=debugLines.join('\n');
    }
    debug(`profile=${renderProfile} ios=${isiOS} dpr=${window.devicePixelRatio||1} threads=${hardwareThreads||'n/a'} memory=${deviceMemory||'n/a'}`);
    window.addEventListener('error',(event)=>debug(`window error: ${event.message||'unknown'}`));
    window.addEventListener('unhandledrejection',(event)=>debug(`promise error: ${String(event.reason?.message||event.reason||'unknown')}`));

    const sleep=(ms)=>new Promise((resolve)=>setTimeout(resolve,ms));
    const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
    const cleanLabel=(value,fallback='')=>String(value||fallback).replace(/[\u0000-\u001f\u007f]/g,'').trim().slice(0,64);
    const normalizeCode=(value)=>cleanLabel(value).toUpperCase();
    const validCoords=(lat,lng)=>Number.isFinite(lat)&&Number.isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180;
    const browserTimezone=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch{return''}})();

    function setPhase(index){els.phases.forEach((phase,i)=>{phase.classList.toggle('active',i===index);phase.classList.toggle('done',i<index)})}
    function setSystemState(text){els.systemState.textContent=text}
    function fatal(code='RENDER_INIT_FAILED'){
      debug(`fatal=${code}`);document.body.classList.add('fatal');document.body.classList.remove('boot-complete');
      els.fatalText.textContent=debugMode?`3D renderer unavailable. Diagnostic: ${code}`:'This device could not initialize the 3D renderer. Reloading the page may restore the graphics context.';
    }
    function bootSequenceLabels(){[[0,'INITIALIZING VISUAL CORE'],[340,'CALIBRATING LATITUDE GRID'],[700,'QUERYING NETWORK POSITION'],[1040,'CROSS-CHECKING GEO NODES'],[1390,'SYNCHRONIZING ORBITAL CAMERA'],[1640,'LOCKING ORIGIN VECTOR']].forEach(([delay,text])=>setTimeout(()=>{if(!document.body.classList.contains('boot-complete'))els.bootStatus.textContent=text},delay))}

    function haversineKm(a,b){const rad=(deg)=>deg*Math.PI/180;const dLat=rad(b.lat-a.lat);const dLng=rad(b.lng-a.lng);const lat1=rad(a.lat);const lat2=rad(b.lat);const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;return 6371*2*Math.atan2(Math.sqrt(h),Math.sqrt(Math.max(0,1-h)))}
    function normalizeLocation(raw,provider){
      if(!raw||typeof raw!=='object')return null;
      const lat=Number(raw.latitude),lng=Number(raw.longitude);if(!validCoords(lat,lng))return null;
      const location={lat,lng,provider,city:cleanLabel(raw.city),region:cleanLabel(raw.region_code||raw.region),country:normalizeCode(raw.country_code||raw.country),timezone:cleanLabel(typeof raw.timezone==='object'?raw.timezone?.id:raw.timezone)};
      location.metadataScore=(location.city?2:0)+(location.region?1:0)+(location.country?1:0)+(location.timezone?1:0)+(browserTimezone&&location.timezone===browserTimezone?4:0);return location;
    }
    async function fetchGeo(url,provider){
      const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),CONFIG.geo.timeoutMs);
      try{const response=await fetch(url,{signal:controller.signal,cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer',headers:{Accept:'application/json'}});if(!response.ok)throw new Error('provider unavailable');const data=await response.json();if(provider==='ipwho'&&data?.success===false)throw new Error('provider rejected request');return normalizeLocation(data,provider)}catch{return null}finally{clearTimeout(timer)}
    }
    function sameRegion(a,b){return Boolean(a.region&&b.region&&normalizeCode(a.region)===normalizeCode(b.region)&&(!a.country||!b.country||a.country===b.country))}
    function sameCountry(a,b){return Boolean(a.country&&b.country&&a.country===b.country)}
    function chooseConsensus(primary,secondary){
      if(!primary&&!secondary)return{...CONFIG.fallback};if(primary&&!secondary)return{...primary,quality:'SINGLE SOURCE'};if(!primary&&secondary)return{...secondary,quality:'SINGLE SOURCE'};
      const distance=haversineKm(primary,secondary),primaryTz=browserTimezone&&primary.timezone===browserTimezone,secondaryTz=browserTimezone&&secondary.timezone===browserTimezone;let selected=primary;
      if(primaryTz!==secondaryTz)selected=secondaryTz?secondary:primary;else if(secondary.metadataScore>primary.metadataScore)selected=secondary;
      if(distance<=CONFIG.geo.agreeKm)return{...selected,quality:'VERIFIED',agreementKm:distance};if(sameRegion(primary,secondary)&&distance<=CONFIG.geo.regionAgreeKm)return{...selected,quality:'REGION VERIFIED',agreementKm:distance};if(sameCountry(primary,secondary))return{...selected,quality:'APPROXIMATE',agreementKm:distance};if(primaryTz!==secondaryTz)return{...selected,quality:'APPROXIMATE',agreementKm:distance};return{...CONFIG.fallback};
    }
    async function resolveApproxLocation(){const [primary,secondary]=await Promise.all([fetchGeo('https://ipapi.co/json/','ipapi'),fetchGeo('https://ipwho.is/','ipwho')]);const result=chooseConsensus(primary,secondary);debug(`geo=${result.quality||'APPROXIMATE'} ${cleanLabel(result.city,'unknown')}`);return{...result,city:cleanLabel(result.city,CONFIG.fallback.city),region:cleanLabel(result.region||result.country,CONFIG.fallback.region)}}

    function viewportSize(){
      const vv=window.visualViewport;const width=Math.max(1,Math.round(vv?.width||document.documentElement.clientWidth||window.innerWidth||1));const height=Math.max(1,Math.round(vv?.height||document.documentElement.clientHeight||window.innerHeight||1));return{width,height};
    }

    function initGlobe(){
      debug('creating Globe.gl renderer');
      const rendererConfig=mobileMode?{antialias:false,alpha:true,preserveDrawingBuffer:false}:{antialias:!economyMode,alpha:true,powerPreference:'high-performance',preserveDrawingBuffer:false};
      const globe=new Globe(els.mount,{animateIn:false,rendererConfig})
        .backgroundColor('rgba(0,0,0,0)').showGlobe(true).showGraticules(true).showAtmosphere(!mobileMode).atmosphereColor(CONFIG.colors.cyan).atmosphereAltitude(.16).enablePointerInteraction(false)
        .pointsTransitionDuration(economyMode?0:280).ringsTransitionDuration(economyMode?0:220).arcsTransitionDuration(economyMode?0:300)
        .arcCurveResolution(mobileMode?16:economyMode?24:64).arcCircularResolution(mobileMode?2:economyMode?3:6);

      const material=globe.globeMaterial();if(material){if(material.color?.set)material.color.set('#06131a');if(material.emissive?.set)material.emissive.set('#001118');material.emissiveIntensity=mobileMode?.58:.72;material.shininess=mobileMode?4:8;material.transparent=false;material.needsUpdate=true}
      const controls=globe.controls();controls.enableZoom=false;controls.enablePan=false;controls.enableRotate=false;controls.autoRotate=false;controls.enableDamping=!mobileMode;controls.dampingFactor=.08;
      const renderer=globe.renderer();renderer.setPixelRatio(mobileMode?1:liteMode?1.05:Math.min(window.devicePixelRatio||1,1.7));renderer.domElement.setAttribute('aria-hidden','true');

      let lastWidth=0,lastHeight=0,resizeTimer;
      const size=(force=false)=>{const next=viewportSize();if(!force&&mobileMode&&next.width===lastWidth&&Math.abs(next.height-lastHeight)<120)return;if(!force&&next.width===lastWidth&&next.height===lastHeight)return;lastWidth=next.width;lastHeight=next.height;globe.width(next.width).height(next.height);debug(`canvas=${next.width}x${next.height}`)};
      size(true);
      const queueResize=(force=false,delay=mobileMode?260:90)=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>size(force),delay)};
      window.addEventListener('resize',()=>queueResize(false),{passive:true});window.addEventListener('orientationchange',()=>queueResize(true,380),{passive:true});window.visualViewport?.addEventListener('resize',()=>queueResize(false,300),{passive:true});

      let lossTimer=0;
      renderer.domElement.addEventListener('webglcontextlost',(event)=>{event.preventDefault();debug('webgl context lost');document.body.classList.add('render-paused');setSystemState('RENDER RECOVERY');els.renderMode.textContent='RENDER PROFILE // RECOVERING';clearTimeout(lossTimer);lossTimer=setTimeout(()=>fatal('WEBGL_CONTEXT_LOST'),2200)},{passive:false});
      renderer.domElement.addEventListener('webglcontextrestored',()=>{clearTimeout(lossTimer);debug('webgl context restored');document.body.classList.remove('render-paused');setSystemState('RENDER RESTORED');els.renderMode.textContent=`RENDER PROFILE // ${renderProfile}`;queueResize(true,100)});

      globe.pointLat('lat').pointLng('lng').pointAltitude('altitude').pointRadius('radius').pointColor('color').ringLat('lat').ringLng('lng').ringAltitude('altitude').ringColor('color').ringMaxRadius('maxRadius').ringPropagationSpeed('speed').ringRepeatPeriod('repeat').arcStartLat('startLat').arcStartLng('startLng').arcEndLat('endLat').arcEndLng('endLng').arcColor('color').arcAltitude('altitude').arcStroke('stroke').arcDashLength('dashLength').arcDashGap('dashGap').arcDashInitialGap('dashInitialGap').arcDashAnimateTime('dashTime');
      return globe;
    }

    async function confirmRenderer(globe){
      await new Promise((resolve)=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
      const renderer=globe.renderer(),context=renderer.getContext?.();if(!context||context.isContextLost?.())throw new Error('WEBGL_CONTEXT_UNAVAILABLE');debug(`webgl ready renderer=${renderer.capabilities?.isWebGL2?'webgl2':'webgl'}`);
    }

    async function addWireframeContinents(globe){
      if(mobileMode){debug('mobile: country polygon layer skipped');return}
      try{const response=await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json',{cache:'force-cache',credentials:'omit',referrerPolicy:'no-referrer'});if(!response.ok)return;const world=await response.json(),countries=topoFeature(world,world.objects.countries).features;globe.polygonsData(countries).polygonAltitude(.006).polygonCapColor(()=>'rgba(4,24,31,.28)').polygonSideColor(()=>'rgba(20,175,195,.025)').polygonStrokeColor(()=>'rgba(112,241,255,.5)').polygonsTransitionDuration(economyMode?0:720)}catch{debug('country layer unavailable')}
    }

    const sourceMarker=(origin)=>({...origin,altitude:.012,radius:.34,color:CONFIG.colors.cyanHot,kind:'source'});
    const texasMarker=()=>({...CONFIG.target,altitude:.014,radius:.42,color:CONFIG.colors.amber,kind:'target'});
    const sourceRing=(origin)=>({...origin,altitude:.008,color:CONFIG.colors.cyan,maxRadius:3.2,speed:2.4,repeat:720});
    const texasRing=()=>({...CONFIG.target,altitude:.009,color:CONFIG.colors.amber,maxRadius:4.6,speed:2.1,repeat:620});
    function arcLayers(origin){const base={startLat:origin.lat,startLng:origin.lng,endLat:CONFIG.target.lat,endLng:CONFIG.target.lng,altitude:CONFIG.arcAltitude};return[{...base,kind:'glow',color:['rgba(112,241,255,.08)','rgba(255,189,99,.13)'],stroke:mobileMode?.32:economyMode?.42:.82,dashLength:1,dashGap:0,dashInitialGap:0,dashTime:0},{...base,kind:'signal',color:[CONFIG.colors.cyanHot,CONFIG.colors.amber],stroke:mobileMode?.22:economyMode?.28:.44,dashLength:.12,dashGap:.88,dashInitialGap:0,dashTime:CONFIG.timing.signalMs}]}

    function toUnit(lat,lng){const phi=lat*Math.PI/180,theta=lng*Math.PI/180,c=Math.cos(phi);return{x:c*Math.cos(theta),y:Math.sin(phi),z:c*Math.sin(theta)}}
    function fromUnit(v){const length=Math.hypot(v.x,v.y,v.z)||1,x=v.x/length,y=v.y/length,z=v.z/length;return{lat:Math.asin(clamp(y,-1,1))*180/Math.PI,lng:Math.atan2(z,x)*180/Math.PI}}
    function greatCirclePoint(start,end,t){
      const a=toUnit(start.lat,start.lng),b=toUnit(end.lat,end.lng),dot=clamp(a.x*b.x+a.y*b.y+a.z*b.z,-1,1),omega=Math.acos(dot);
      if(omega<1e-5)return fromUnit(a);const sinOmega=Math.sin(omega);if(Math.abs(sinOmega)<1e-5)return{lat:start.lat+(end.lat-start.lat)*t,lng:start.lng+(end.lng-start.lng)*t};const sa=Math.sin((1-t)*omega)/sinOmega,sb=Math.sin(t*omega)/sinOmega;return fromUnit({x:a.x*sa+b.x*sb,y:a.y*sa+b.y*sb,z:a.z*sa+b.z*sb});
    }

    function createNoopTrail(){return{show(){},hide(){},update(){},dispose(){}}}
    async function createSignalTrail(globe){
      if(mobileMode){debug('mobile: using Globe.gl native signal trail');return createNoopTrail()}
      try{
        const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js');
        const count=liteMode?8:20,positions=new Float32Array(count*3),alphas=new Float32Array(count);for(let i=0;i<count;i+=1)alphas[i]=Math.pow(1-i/count,1.45);
        const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));geometry.setAttribute('aAlpha',new THREE.BufferAttribute(alphas,1));
        const material=new THREE.ShaderMaterial({transparent:true,depthWrite:false,depthTest:true,blending:THREE.AdditiveBlending,uniforms:{uColor:{value:new THREE.Color(CONFIG.colors.cyan)},uPixelRatio:{value:Math.min(window.devicePixelRatio||1,liteMode?1:1.6)}},vertexShader:`attribute float aAlpha;varying float vAlpha;uniform float uPixelRatio;void main(){vec4 mvPosition=modelViewMatrix*vec4(position,1.0);float depthScale=clamp(255.0/max(90.0,-mvPosition.z),0.55,2.1);gl_PointSize=(6.0+22.0*aAlpha)*uPixelRatio*depthScale;gl_Position=projectionMatrix*mvPosition;vAlpha=aAlpha;}`,fragmentShader:`varying float vAlpha;uniform vec3 uColor;void main(){vec2 p=gl_PointCoord-vec2(0.5);float d=length(p)*2.0;float halo=1.0-smoothstep(0.08,1.0,d);float core=1.0-smoothstep(0.0,0.24,d);float alpha=(halo*0.54+core*0.8)*vAlpha;if(alpha<0.012)discard;vec3 color=mix(uColor,vec3(1.0),core*0.6);gl_FragColor=vec4(color,alpha);}`});
        const particles=new THREE.Points(geometry,material);particles.visible=false;particles.frustumCulled=false;particles.renderOrder=1000;globe.scene().add(particles);
        return{show(){particles.visible=true},hide(){particles.visible=false},update(origin,progress){const attribute=geometry.getAttribute('position');for(let i=0;i<count;i+=1){const p=clamp(progress-i*(liteMode?.028:.014),0,1),geo=greatCirclePoint(origin,CONFIG.target,p),altitude=.015+Math.sin(Math.PI*p)*CONFIG.arcAltitude,xyz=globe.getCoords(geo.lat,geo.lng,altitude);attribute.setXYZ(i,xyz.x,xyz.y,xyz.z)}attribute.needsUpdate=true},dispose(){globe.scene().remove(particles);geometry.dispose();material.dispose()}};
      }catch{debug('desktop particle shader unavailable; native arc retained');return createNoopTrail()}
    }

    function animateSignal(trail,origin){return new Promise((resolve)=>{const started=performance.now();trail.show();const frame=(now)=>{const progress=clamp((now-started)/CONFIG.timing.signalMs,0,1);trail.update(origin,progress);if(progress<1)requestAnimationFrame(frame);else resolve()};requestAnimationFrame(frame)})}
    async function typeMessage(text){els.message.textContent='';els.message.dataset.text='';document.body.classList.add('typing');for(const character of text){els.message.textContent+=character;els.message.dataset.text=els.message.textContent;await sleep(CONFIG.timing.typeBaseMs+(/[.,!?]/.test(character)?CONFIG.timing.typePunctuationMs:0))}document.body.classList.remove('typing');els.srStatus.textContent=text}
    async function glitchFinish(){if(reducedMotion)return;document.body.classList.add('glitching');await sleep(CONFIG.timing.glitchMs);document.body.classList.remove('glitching')}
    function displayOrigin(origin){els.originLabel.textContent=`${origin.city.toUpperCase()}, ${origin.region.toUpperCase()}`;els.originCoords.textContent=`${origin.lat.toFixed(2)}°, ${origin.lng.toFixed(2)}° // ${origin.quality||'APPROXIMATE'}`}
    async function runReducedMotion(globe,origin){displayOrigin(origin);globe.pointsData([texasMarker()]);globe.ringsData([texasRing()]);globe.pointOfView({lat:CONFIG.target.lat,lng:CONFIG.target.lng,altitude:CONFIG.camera.finalAltitude},0);setPhase(3);setSystemState('TEXAS LOCKED');document.body.classList.add('globe-ready','boot-complete');els.message.textContent=CONFIG.message;els.message.dataset.text=CONFIG.message;els.srStatus.textContent=CONFIG.message}

    async function runSequence(){
      bootSequenceLabels();const minimumBoot=sleep(CONFIG.timing.bootMs),locationPromise=resolveApproxLocation();
      let globe;try{globe=initGlobe();await confirmRenderer(globe)}catch(error){debug(`renderer init failed: ${error?.message||error}`);fatal(error?.message||'RENDER_INIT_FAILED');return}
      addWireframeContinents(globe);
      const origin=await locationPromise;displayOrigin(origin);if(reducedMotion){await minimumBoot;await runReducedMotion(globe,origin);return}
      globe.pointOfView({lat:origin.lat,lng:origin.lng,altitude:CONFIG.camera.cityAltitude},0);globe.pointsData([sourceMarker(origin)]);globe.ringsData([sourceRing(origin)]);
      await minimumBoot;els.bootStatus.textContent=origin.quality==='VERIFIED'?'ORIGIN VERIFIED':'ORIGIN ACQUIRED';setSystemState(els.bootStatus.textContent);document.body.classList.add('globe-ready');await sleep(260);document.body.classList.add('boot-complete');await sleep(CONFIG.timing.revealHoldMs);
      setPhase(1);setSystemState('ORBITAL PERSPECTIVE');const midpoint=greatCirclePoint(origin,CONFIG.target,.5);globe.pointOfView({lat:midpoint.lat,lng:midpoint.lng,altitude:economyMode?2.48:CONFIG.camera.orbitAltitude},CONFIG.timing.zoomOutMs);await sleep(CONFIG.timing.zoomOutMs);
      setPhase(2);setSystemState('SIGNAL OUTBOUND');const arcs=arcLayers(origin);globe.arcsData(arcs);const trail=await createSignalTrail(globe);await animateSignal(trail,origin);trail.hide();
      globe.arcsData([arcs[0]]);globe.pointsData([sourceMarker(origin),texasMarker()]);globe.ringsData([texasRing()]);setPhase(3);setSystemState('SIGNAL RECEIVED');await sleep(CONFIG.timing.landingBeatMs);
      globe.pointOfView({lat:CONFIG.target.lat,lng:CONFIG.target.lng,altitude:CONFIG.camera.texasAltitude},CONFIG.timing.texasZoomMs);await Promise.all([sleep(CONFIG.timing.texasZoomMs),typeMessage(CONFIG.message)]);await glitchFinish();setSystemState('TEXAS LOCKED');globe.pointsData([texasMarker()]);globe.arcsData([]);globe.pointOfView({lat:CONFIG.target.lat,lng:CONFIG.target.lng,altitude:CONFIG.camera.finalAltitude},CONFIG.timing.finalSettleMs);await sleep(CONFIG.timing.finalSettleMs);trail.dispose();debug('sequence complete');
    }

    runSequence().catch((error)=>{debug(`sequence failed: ${error?.message||error}`);fatal('SEQUENCE_FAILED')});
  </script>
</body>
