name: Site Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate public site
        run: node scripts/validate-site.mjs
      - name: Validate HTML semantics
        run: npx --yes html-validate@10.4.0 index.html 404.html account/index.html login/index.html signup/index.html journal/index.html games/index.html games/*/index.html
      - name: Install Worker dependencies
        working-directory: cloudflare-admin
        run: npm ci
      - name: Test Worker security helpers
        working-directory: cloudflare-admin
        run: npm test
      - name: Build Worker bundle
        working-directory: cloudflare-admin
        run: npm exec wrangler -- deploy --dry-run
