name: Polish Site Metadata

on:
  push:
    paths:
      - '.github/workflows/polish-site-metadata.yml'

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add CloudLab metadata to public URLs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html
          import re

          root = Path('.')
          logo = 'https://danny4686.com/assets/images/cloudlab-logo.png'

          def get(pattern, text, default=''):
              m = re.search(pattern, text, re.I | re.S)
              return html.unescape(m.group(1).strip()) if m else default

          def inject_public(path: Path):
              text = path.read_text(encoding='utf-8')
              if '<!-- CLOUDLAB_META_START -->' in text:
                  text = re.sub(r'\s*<!-- CLOUDLAB_META_START -->.*?<!-- CLOUDLAB_META_END -->\s*', '\n', text, flags=re.S)
              title = get(r'<title>(.*?)</title>', text, 'CloudLab | Danny4686')
              desc = get(r'<meta\s+name=["\']description["\']\s+content=["\'](.*?)["\']\s*/?>', text, 'A CloudLab experience from Danny4686.')
              rel = path.as_posix()
              url = 'https://danny4686.com/' + rel.removesuffix('index.html')
              block = f'''\n  <!-- CLOUDLAB_META_START -->
  <meta name="author" content="Danny4686">
  <meta name="application-name" content="CloudLab">
  <meta name="apple-mobile-web-app-title" content="CloudLab">
  <link rel="canonical" href="{html.escape(url, quote=True)}">
  <meta property="og:site_name" content="CloudLab">
  <meta property="og:title" content="{html.escape(title, quote=True)}">
  <meta property="og:description" content="{html.escape(desc, quote=True)}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{html.escape(url, quote=True)}">
  <meta property="og:image" content="{logo}">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:alt" content="CloudLab Earth logo">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{html.escape(title, quote=True)}">
  <meta name="twitter:description" content="{html.escape(desc, quote=True)}">
  <meta name="twitter:image" content="{logo}">
  <link rel="shortcut icon" href="/assets/images/cloudlab-logo.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/images/cloudlab-logo.png">
  <link rel="manifest" href="/site.webmanifest">
  <!-- CLOUDLAB_META_END -->'''
              marker = re.search(r'(<meta\s+name=["\']theme-color["\'][^>]*>)', text, re.I)
              if marker:
                  text = text[:marker.end()] + block + text[marker.end():]
              else:
                  text = text.replace('</title>', '</title>' + block, 1)
              path.write_text(text, encoding='utf-8')

          for page in sorted((root / 'games').glob('*/index.html')):
              inject_public(page)

          def inject_private(path: Path, canonical: str):
              text = path.read_text(encoding='utf-8')
              if '<!-- CLOUDLAB_PRIVATE_META_START -->' in text:
                  text = re.sub(r'\s*<!-- CLOUDLAB_PRIVATE_META_START -->.*?<!-- CLOUDLAB_PRIVATE_META_END -->\s*', '\n', text, flags=re.S)
              block = f'''\n  <!-- CLOUDLAB_PRIVATE_META_START -->
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="author" content="Danny4686">
  <meta name="application-name" content="CloudLab">
  <meta name="apple-mobile-web-app-title" content="CloudLab">
  <link rel="canonical" href="{canonical}">
  <link rel="shortcut icon" href="/assets/images/cloudlab-logo.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/images/cloudlab-logo.png">
  <link rel="manifest" href="/site.webmanifest">
  <!-- CLOUDLAB_PRIVATE_META_END -->'''
              marker = re.search(r'(<meta\s+name=["\']theme-color["\'][^>]*>)', text, re.I)
              if marker:
                  text = text[:marker.end()] + block + text[marker.end():]
              else:
                  text = text.replace('</title>', '</title>' + block, 1)
              path.write_text(text, encoding='utf-8')

          private_pages = {
              Path('login/index.html'): 'https://danny4686.com/login/',
              Path('signup/index.html'): 'https://danny4686.com/signup/',
              Path('account/index.html'): 'https://danny4686.com/account/',
          }
          for page, canonical in private_pages.items():
              if page.exists():
                  inject_private(page, canonical)
          PY

      - name: Commit metadata polish
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No metadata changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/*/index.html login/index.html signup/index.html account/index.html
          git commit -m "Polish CloudLab metadata across public URLs"
          git pull --rebase origin main
          git push origin HEAD:main
