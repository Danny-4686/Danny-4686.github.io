name: Import Rocket Tycoon banner

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-rocket-banner.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Rocket Tycoon banner
        shell: bash
        run: |
          mkdir -p assets/images
          curl --fail --location --retry 3 --retry-delay 2 'https://cdn.discordapp.com/attachments/1138912646943473785/1533916726352285696/content.png?ex=6a723ac6&is=6a70e946&hm=81e036a94d209ebb480eebcff65613986baeab1534d86506c508a308ed0a20f9&' --output assets/images/rocket-tycoon-banner.png
          file assets/images/rocket-tycoon-banner.png

      - name: Commit banner
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/rocket-tycoon-banner.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Import Rocket Tycoon banner'
          git push origin HEAD:main
