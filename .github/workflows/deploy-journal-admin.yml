name: Deploy Journal Admin

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-admin/**"
      - ".github/workflows/deploy-journal-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_ADMIN_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-admin
          command: deploy
