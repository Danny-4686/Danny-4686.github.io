name: Deploy Journal Admin

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-admin/**"
      - ".github/workflows/deploy-journal-admin.yml"
  workflow_dispatch:

concurrency:
  group: deploy-journal-admin
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-admin
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - id: cloudflare_deploy
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-admin
          command: deploy
      - name: Publish safe deployment status
        if: always()
        working-directory: .
        env:
          DEPLOY_OUTCOME: ${{ steps.cloudflare_deploy.outcome }}
        run: |
          git fetch origin main
          git rebase origin/main
          mkdir -p .deployment-status
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone

          status = {
              "workflow": "Deploy Journal Admin",
              "commit": os.environ.get("GITHUB_SHA", ""),
              "outcome": os.environ.get("DEPLOY_OUTCOME", "unknown"),
              "completedAt": datetime.now(timezone.utc).isoformat()
          }
          with open(".deployment-status/journal-admin.json", "w", encoding="utf-8") as handle:
              json.dump(status, handle, indent=2)
              handle.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deployment-status/journal-admin.json
          git diff --cached --quiet || git commit -m "Record Journal Admin deployment status [skip ci]"
          git push origin HEAD:main
      - name: Fail workflow when deployment failed
        if: steps.cloudflare_deploy.outcome != 'success'
        run: exit 1
