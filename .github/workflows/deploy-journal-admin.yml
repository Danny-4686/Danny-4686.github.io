name: Deploy Journal Admin

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-admin/**"
      - ".github/workflows/deploy-journal-admin.yml"
  workflow_dispatch:

concurrency:
  group: deploy-journal-admin
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-admin
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - id: cloudflare_deploy
        continue-on-error: true
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-admin
          command: deploy
      - name: Verify live community API
        id: community_smoke
        if: steps.cloudflare_deploy.outcome == 'success'
        continue-on-error: true
        working-directory: .
        run: |
          sleep 12
          HEALTH_CODE="$(curl -sS --retry 3 --retry-delay 2 --retry-all-errors --max-time 40 -o /tmp/community-health.json -w '%{http_code}' 'https://api.danny4686.com/v1/health?deep=1' || printf '000')"
          CHECK_NAME="DeployCheck${GITHUB_RUN_NUMBER}"
          CHECK_NAME="${CHECK_NAME:0:20}"
          USERNAME_CODE="$(curl -sS --retry 3 --retry-delay 2 --retry-all-errors --max-time 25 -o /tmp/community-username.json -w '%{http_code}' "https://api.danny4686.com/v1/username?name=${CHECK_NAME}" || printf '000')"
          ADMIN_CODE="$(curl -sS --retry 3 --retry-delay 2 --retry-all-errors --max-time 25 -o /tmp/admin-root.html -w '%{http_code}' 'https://admin.danny4686.com/' || printf '000')"
          export HEALTH_CODE USERNAME_CODE ADMIN_CODE CHECK_NAME
          python - <<'PY'
          import json, os
          from pathlib import Path

          def read_json(path):
              try:
                  return json.loads(Path(path).read_text(encoding="utf-8"))
              except Exception as exc:
                  try:
                      raw = Path(path).read_text(encoding="utf-8")[:2000]
                  except Exception:
                      raw = ""
                  return {"parseError": str(exc), "raw": raw}

          health = read_json("/tmp/community-health.json")
          username = read_json("/tmp/community-username.json")
          admin_html = Path("/tmp/admin-root.html").read_text(encoding="utf-8", errors="replace") if Path("/tmp/admin-root.html").exists() else ""
          result = {
              "healthHttpStatus": os.environ.get("HEALTH_CODE", "000"),
              "health": health,
              "usernameHttpStatus": os.environ.get("USERNAME_CODE", "000"),
              "usernameCheck": username,
              "usernameChecked": os.environ.get("CHECK_NAME", ""),
              "adminHttpStatus": os.environ.get("ADMIN_CODE", "000"),
              "adminLoginVisible": "Sign in with GitHub" in admin_html
          }
          Path("/tmp/community-smoke.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")

          healthy = (
              os.environ.get("HEALTH_CODE") == "200"
              and health.get("ok") is True
              and health.get("storageReady") is True
              and health.get("accountFeaturesConfigured") is True
              and os.environ.get("USERNAME_CODE") == "200"
              and isinstance(username.get("available"), bool)
              and os.environ.get("ADMIN_CODE") == "200"
              and "Sign in with GitHub" in admin_html
          )
          if not healthy:
              raise SystemExit(1)
          PY
      - name: Fail workflow when deployment or live verification failed
        if: steps.cloudflare_deploy.outcome != 'success' || steps.community_smoke.outcome != 'success'
        run: exit 1
